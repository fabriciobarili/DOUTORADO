<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" font-family="sans-serif" role="img" aria-label="Gráfico comparando uma função linear (reta) com uma função não-linear (curva)">
  <rect x="0" y="0" width="440" height="300" rx="10" fill="#ffffff"/>
  <!-- eixos -->
  <line x1="60" y1="250" x2="415" y2="250" stroke="#334155" stroke-width="1.5"/>
  <line x1="60" y1="250" x2="60" y2="35" stroke="#334155" stroke-width="1.5"/>
  <polygon points="415,250 407,246 407,254" fill="#334155"/>
  <polygon points="60,35 56,43 64,43" fill="#334155"/>
  <text x="420" y="255" font-size="13" fill="#334155">x</text>
  <text x="46" y="34" font-size="13" fill="#334155">f(x)</text>

  <!-- função linear: incremento constante -->
  <line x1="60" y1="232" x2="410" y2="92" stroke="#64748b" stroke-width="2.5"/>

  <!-- função não-linear: incremento cresce -->
  <path d="M 60 248 C 235 244, 325 205, 410 48" fill="none" stroke="#2563eb" stroke-width="3"/>

  <!-- legenda -->
  <rect x="78" y="52" width="250" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <line x1="90" y1="68" x2="120" y2="68" stroke="#64748b" stroke-width="2.5"/>
  <text x="128" y="72" font-size="12" fill="#334155">linear: incremento constante</text>
  <line x1="90" y1="90" x2="120" y2="90" stroke="#2563eb" stroke-width="3"/>
  <text x="128" y="94" font-size="12" fill="#334155">não-linear: incremento cresce</text>
</svg>
